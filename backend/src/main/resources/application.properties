spring.application.name=recruiting-system

# ---------------------------------------------------------------------------
# Database: PostgreSQL (the team's shared cloud database on Neon).
# The address and password are NOT in the repository. Put them in backend/.env
# (copy backend/.env.example and fill in the three values), or set the
# environment variables DB_URL, DB_USER and DB_PASSWORD.
# Data is kept in the database, so it is still there after a restart.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates missing tables and columns from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Resume uploads: ResumeController accepts PDF or DOCX up to 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# User Login (development).
# The sample accounts admin@, recruiter@, applicant@ and dormant@example.com
# are created with this password so that sign in can be tried locally.
rams.seed.demo-password=Demo-pass-2026
# When true, every user id a request names (X-Applicant-Id / X-Recruiter-Id /
# X-Administrator-Id headers, applicantId / recruiterId / administratorId
# parameters, /api/applicants/{id}/...) must belong to the signed-in user.
# Set it to false to use the two pages served by the back end without signing in.
rams.login.enforce=true
