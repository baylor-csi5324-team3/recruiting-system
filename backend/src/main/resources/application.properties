spring.application.name=recruiting-system

# ---------------------------------------------------------------------------
# Development database: H2, in memory.
# Nothing to install. The schema is rebuilt on every start and the data is
# discarded when the application stops.
# To use another database later (e.g. PostgreSQL), only this file and the driver
# dependency change, because the code talks to Spring Data JPA, not to a driver.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:rams;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate derive the schema from the JPA entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Browse the in-memory database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:rams, user: sa, no password)
spring.h2.console.enabled=true

# User Login (development).
# The sample accounts admin@, recruiter@, applicant@ and dormant@example.com
# are created with this password so that sign in can be tried locally.
rams.seed.demo-password=Demo-pass-2026
# When true, every user id a request names (X-Applicant-Id / X-Recruiter-Id /
# X-Administrator-Id headers, applicantId / recruiterId / administratorId
# parameters, /api/applicants/{id}/...) must belong to the signed-in user.
# Set it to false to use the two pages served by the back end without signing in.
rams.login.enforce=true
