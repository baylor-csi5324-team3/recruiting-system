<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Applications</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 18px;background:#f8fafc;color:#172033}main,article{background:white;border:1px solid #dce3ec;border-radius:12px;padding:20px;margin:16px 0}select,button{padding:10px;border-radius:7px}button{background:#205aa0;color:white;border:0;cursor:pointer}.stage{color:#13653e;font-weight:700}.error{color:#a21b29}a{color:#205aa0}</style></head><body><h1>My Applications</h1><p><a href="/submit-application.html">Submit another application</a></p><main><label for="applicant">Applicant: </label><select id="applicant"></select> <button id="refresh">Refresh from server</button><p id="notice" role="status"></p><div id="results"></div></main><script>
const $=id=>document.getElementById(id);
async function request(url){const r=await fetch(url);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||`HTTP ${r.status}`);return d;}
async function refresh(){const container=$('results');container.replaceChildren();try{const items=await request(`/api/applications?applicantId=${$('applicant').value}`);$('notice').textContent=`${items.length} application(s) loaded from backend.`;for(const item of items){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=item.jobTitle;article.append(heading);for(const [label,value] of [['Company',item.companyName],['Application ID',item.applicationId],['Job ID',item.jobPostingId],['Resume',item.resumeFilename||'(legacy record)'],['Submitted',item.submittedAt]]){const p=document.createElement('p');p.textContent=`${label}: ${value}`;article.append(p);}const stage=document.createElement('p');stage.className='stage';stage.textContent=`Stage: ${item.stage}`;article.append(stage);container.append(article);}}catch(e){$('notice').textContent=e.message;$('notice').className='error';}}
async function init(){try{const people=await request('/api/applicants');const selected=new URLSearchParams(location.search).get('applicantId');for(const a of people){const option=document.createElement('option');option.value=a.id;option.textContent=`${a.name} (#${a.id})`;$('applicant').append(option);}if(selected)$('applicant').value=selected;await refresh();}catch(e){$('notice').textContent=e.message;}}
$('refresh').onclick=refresh;$('applicant').onchange=refresh;init();
</script></body></html>
