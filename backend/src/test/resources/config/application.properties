# Tests only: the identity check of User Login stays off, so the existing tests call the end points
# directly. LoginGateTest switches it on for itself (rams.login.enforce=true).
rams.login.enforce=false

# Tests only: a fresh in-memory database for every test run (the application itself keeps a file database).
spring.datasource.url=jdbc:h2:mem:rams;DB_CLOSE_DELAY=-1
